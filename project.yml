name: PhoneZip

options:
  bundleIdPrefix: dev.jey
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: FT5G52U7YL

packages:
  # Writes the zip entry by entry straight to disk, with ZIP64 so archives
  # over 4 GB (any real photo library) still open on a Mac or PC.
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.19

targets:
  PhoneZip:
    type: application
    platform: iOS
    sources:
      - path: PhoneZip
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jey.phonezip
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PhoneZip
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "PhoneZip reads your photos and videos to copy them into a zip file you export. Nothing is uploaded."
        # Finished zips show up in Files > On My iPhone > PhoneZip, which is
        # the reliable way to move multi-GB files off (AirDrop, USB, Finder).
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
